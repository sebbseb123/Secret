function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function paras(b){ return (Array.isArray(b) ? b : [b]).filter(Boolean).map(function(t){ return "<p>"+esc(t)+"</p>"; }).join(""); }

function pageHTML(p, n){
  var num = '<div class="num">'+(p.n || n)+'</div>';
  if (p.type === "cover") return '<h2>'+esc(p.title)+'</h2>' + (p.body ? paras(p.body) : "");
  var img = p.src ? '<figure><img src="'+p.src+'" alt="'+esc(p.alt || p.title || p.caption || "Illustration")+'"></figure>' : "";
  if (p.type === "story") return img + '<p class="msg">'+esc(p.body)+'</p>' + num;
  if (p.type === "image") return img + (p.caption ? '<p class="cap">'+esc(p.caption)+'</p>' : "") + num;
  if (p.type === "mixed") return img + '<h2>'+esc(p.title || "")+'</h2>' + paras(p.body) + num;
  return '<h2>'+esc(p.title || "")+'</h2>' + paras(p.body) + num;
}

var sheets = [], total = 0, cur = 0;

function build(){
  book.innerHTML = "";
  sheets = [];
  cur = 0;
  for (var i = 0; i < pages.length; i += 2){
    var f = pages[i], b = pages[i+1] || { type:"text", title:"", body:"" };
    var el = document.createElement("div");
    el.className = "sheet";
    el.innerHTML =
      '<div class="face front '+f.type+'">'+pageHTML(f, i+1)+'</div>' +
      '<div class="face back '+b.type+'">'+pageHTML(b, i+2)+'</div>';
    el.querySelector(".front").addEventListener("click", function(){ go(1); });
    el.querySelector(".back").addEventListener("click", function(){ go(-1); });
    book.appendChild(el);
    sheets.push(el);
  }
  total = sheets.length;
  setZ();
  render();
}

function setZ(){
  sheets.forEach(function(s, i){ s.style.zIndex = i < cur ? i : total - i; });
}

function render(){
  sheets.forEach(function(s, i){ s.classList.toggle("flipped", i < cur); });
  book.style.transform = cur === 0 ? "translateX(-25%)" : cur === total ? "translateX(25%)" : "translateX(0)";
  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === total;
  statusEl.textContent = cur === 0 ? "Cover" : cur === total ? "Back cover" : "Pages " + (cur*2) + "–" + (cur*2+1);
}

function go(dir){
  var next = cur + dir;
  if (next < 0 || next > total) return;
  var moving = sheets[dir > 0 ? cur : next];
  moving.style.zIndex = total + 2;           // keep the turning page on top
  cur = next;
  render();
  setTimeout(setZ, 900);
}

nextBtn.addEventListener("click", function(){ go(1); });
prevBtn.addEventListener("click", function(){ go(-1); });
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowRight") go(1);
  if (e.key === "ArrowLeft") go(-1);
});
var sx = null;

  if (sx === null) return;
  var dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
  sx = null;
}, {passive:true});


const nextButton = document.getElementById('next');
const prevButton = document.getElementById('prev');
const bgMusic = document.getElementById('bgMusic');


if (bgMusic) {
  bgMusic.loop = true;
}


function handlePageTurnAudio() {
  if (bgMusic && bgMusic.paused) {
    bgMusic.play().catch(error => {
      console.log("Playback interaction registered but blocked by browser:", error);
    });
  }
}


nextButton.addEventListener('click', handlePageTurnAudio);
prevButton.addEventListener('click', handlePageTurnAudio);


build();
</script>
